[build]
command = "npm run build"
publish = "_site"

# https://docs.netlify.com/routing/redirects/#syntax-for-the-netlify-configuration-file

[[redirects]]
from = "/catalog/:id"
to = "/portal/:id"
status = 302

[[redirects]]
from = "/add/"
to = "/contribute/#add-an-individual-portal"
status = 302

# duplicate entry, removed
[[redirects]]
from = "/portal/city-of-chicago-data-portal/"
to = "/portal/chicago/"
status = 301

# replaced by a successor that's also listed, merged
[[redirects]]
from = "/portal/finland/"
to = "/portal/national-open-data-portal-finland/"
status = 301

[[redirects]]
from = "/portal/digitaliser_dk/"
to = "/portal/datavejviser-dk/"
status = 301

[[redirects]]
from = "/portal/thailand_opendata/"
to = "/portal/data-go-th---official-thai-government-portal/"
status = 301
