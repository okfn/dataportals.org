name: Check Portal URLs

on:
  workflow_dispatch:
  # catches portals that go offline without anyone editing the data
  schedule:
    # Mondays, 06:00 UTC
    - cron: 0 6 * * 1
  pull_request:
    paths:
      - .github/workflows/link_check.yml
      - data/portals.csv
      - lib/check_urls.js

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Check URLs in portals.csv
        run: node lib/check_urls.js
